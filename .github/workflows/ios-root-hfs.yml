name: ios-root-hfs

# Builds the HFS+ iOS root volume that the SWEET kernel mounts from the
# `userdata` partition (rd=ufsroot0).
#
# Uses the device repository's own scripts/rebuild-root.sh (the same recipe the
# port author booted), not ios-sweet's mkiosroot.sh: the latter leaves the dyld
# shared cache as HFS+ hard links whose catalog records have an empty data fork,
# which the SWEET kernel's minimal reader cannot resolve (SpringBoard then waits
# forever on __ulock_wait while the console shows "hfs: set hardlink bit ...").
# rebuild-root.sh copies every cache file for real and verifies it after fsck.
#
# The result is published as split release assets (GitHub caps a single
# asset at 2 GiB); concatenate the parts in order to recover the image.

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "IPSW to pull the root components from"
        required: true
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      size:
        description: "HFS+ volume size"
        required: true
        default: "16G"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install host tools
        run: |
          set -e
          df -h /
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hfsprogs rsync unzip curl python3 util-linux \
            build-essential cmake pkg-config libfuse3-dev libbz2-dev zlib1g-dev \
            libattr1-dev libicu-dev libssl-dev
          sudo apt-get install -y --no-install-recommends apfs-fuse \
            || echo "::warning::apfs-fuse is not packaged here; the next step will build it"
          sudo modprobe hfsplus || echo "hfsplus module missing"
          sudo modprobe fuse || true
          ls -l /dev/fuse || true
          echo "--- apfs-fuse ---"
          which apfs-fuse && apfs-fuse --help 2>&1 | head -3 || true
          echo "--- hfsprogs ---"
          mkfs.hfsplus -V 2>&1 | head -2 || true

      - name: Ensure apfs-fuse (build upstream if the archive has none)
        run: |
          set -e
          if command -v apfs-fuse >/dev/null 2>&1; then
            echo "packaged apfs-fuse present"
            exit 0
          fi
          git clone --depth 1 --recursive https://github.com/sgan81/apfs-fuse /tmp/apfs-src
          cmake -S /tmp/apfs-src -B /tmp/apfs-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/apfs-src/build -j"$(nproc)"
          sudo install -m 0755 /tmp/apfs-src/build/apfs-fuse /usr/local/bin/apfs-fuse
          hash -r
          apfs-fuse --help 2>&1 | head -3

      - name: Provide an img2simg shim (rebuild-root.sh calls it)
        run: |
          set -e
          sudo tee /usr/local/bin/img2simg >/dev/null <<EOF
          #!/bin/sh
          exec python3 "$GITHUB_WORKSPACE/scripts/mksimg.py" "\$1" -o "\$2"
          EOF
          sudo chmod +x /usr/local/bin/img2simg
          img2simg 2>&1 | head -2 || true

      - name: Download IPSW
        run: |
          set -e
          curl -fL --retry 4 --retry-delay 10 --retry-all-errors \
            -o ipsw.zip "${{ inputs.ipsw_url }}"
          ls -l ipsw.zip
          df -h /

      - name: Build HFS+ root (rebuild-root.sh: real dyld cache copies)
        run: |
          set -e
          sudo bash scripts/rebuild-root.sh ipsw.zip ios16-root.img "${{ inputs.size }}"
          rm -f ipsw.zip
          ls -l ios16-root.img ios16-root.simg
          df -h /

      - name: Sanity check the volume
        run: |
          set -e
          sudo modprobe hfsplus || true
          mkdir -p /tmp/chk
          sudo mount -t hfsplus -o loop,force,ro ios16-root.img /tmp/chk
          echo "--- top level ---"
          ls /tmp/chk
          echo "--- key paths ---"
          for p in sbin/launchd System/Library/CoreServices/SystemVersion.plist \
                   System/Library/Caches/com.apple.dyld \
                   private/preboot/Cryptexes/OS private/preboot/Cryptexes/App \
                   private/var/keybags/systembag.kb; do
            if sudo test -e "/tmp/chk/$p"; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "--- dyld cache sizes (must be >1 GiB total, not 0-byte link records) ---"
          sudo du -sh /tmp/chk/System/Library/Caches/com.apple.dyld
          sudo find /tmp/chk/System/Library/Caches/com.apple.dyld -type f -printf '%s %p\n' | sort -n | tail -5
          echo "--- usage ---"
          df -h /tmp/chk
          sudo umount /tmp/chk

      - name: Rebuild the sparse image and hash it
        run: |
          set -e
          rm -f ios16-root.simg
          python3 scripts/mksimg.py ios16-root.img -o ios16-root.simg
          ls -l ios16-root.simg
          rm -f ios16-root.img
          sha256sum ios16-root.simg | tee ios16-root.simg.sha256
          df -h /

      - name: Split and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          split -b 1900M -d -a 2 ios16-root.simg root-part.
          ls -l root-part.*
          sha256sum root-part.* > root-parts.sha256
          cat root-parts.sha256
          tag="iosroot-16.7.16-real-$(date +%Y%m%d-%H%M%S)"
          {
            echo "HFS+ iOS root for the SWEET kernel, built from ${{ inputs.ipsw_url }}"
            echo ""
            echo "Built with scripts/rebuild-root.sh (real dyld-cache copies, not HFS+ hard links)."
            echo ""
            echo "Volume: ${{ inputs.size }} case-sensitive journaled HFS+ (label iOSRoot)"
            echo "Flash with:"
            echo '```'
            echo 'cat root-part.* > ios16-root.simg'
            echo 'fastboot flash userdata ios16-root.simg'
            echo '```'
            echo ""
            echo "Sparse image sha256: see ios16-root.simg.sha256"
          } > notes.md
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" --title "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          for f in root-part.* ios16-root.simg.sha256 root-parts.sha256; do
            echo "uploading $f"
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
          done
          echo "published $tag"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
